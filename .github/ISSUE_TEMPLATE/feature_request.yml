name: Feature request / 功能建议
description: 提出具体的行为或制作改进
title: "[Feature] "
body:
  - type: textarea
    id: problem
    attributes:
      label: 想解决的问题
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议的行为
    validations:
      required: true
  - type: textarea
    id: references
    attributes:
      label: 参考资料
      description: 如涉及素材，请说明来源与可用授权
